plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 需要额外依赖其它模组时在这里加仓库，Loom 已自动处理 Minecraft / Fabric 相关仓库
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"livingcity" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 数据生成（Data Generation）运行配置
	runs {
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=livingcity"
			runDir "build/datagen"
		}
	}
}

// 数据生成的输出目录同时作为资源目录
sourceSets {
	main {
		resources {
			srcDirs += ['src/main/generated']
		}
		java {
			// 无头模拟核心（纯 Java 17，零 MC 依赖）直接参与编译，保持单一源码
			srcDir file('sim/src')
		}
	}
	test {
		compileClasspath += sourceSets.main.compileClasspath
	}
	offline {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	from('tools/city-map.html') {
		into 'livingcity-web'
	}

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// 模拟核心回归：纯 Java、零 MC 依赖，秒级。等价于在 livingcity-sim 里手敲 javac + java
tasks.register('simTest', JavaExec) {
	group = 'verification'
	description = '跑 citysim 回归用例（退出码 0 = 全绿）'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'citysim.RegressionTests'
	// MC 的 runtimeClasspath 很大，不给足内存容易在类加载阶段就 OOM
	maxHeapSize = '1g'
	// 不加这两个，Windows 终端里中文用例名会变成乱码
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.register('ledgerSaveTest', JavaExec) {
	group = 'verification'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
	mainClass = 'com.livingcity.data.CityLedgerSaveTest'
}

tasks.named('check') {
	dependsOn 'simTest', 'ledgerSaveTest'
}


def offlineAgent = tasks.register('offlineAccessAgent', Jar) {
    archiveClassifier = 'offline-access'
    destinationDirectory = layout.buildDirectory.dir('offline')
    dependsOn offlineClasses
    from(sourceSets.offline.output) {
        include 'com/livingcity/offline/NamedMinecraftAgent*.class'
    }
    manifest.attributes('Premain-Class': 'com.livingcity.offline.NamedMinecraftAgent')
}

def namedMinecraftAccess = {
    ["-javaagent:" + offlineAgent.get().archiveFile.get().asFile.absolutePath]
} as CommandLineArgumentProvider

tasks.named('ledgerSaveTest', JavaExec) {
    dependsOn offlineAgent
    jvmArgumentProviders.add(namedMinecraftAccess)
}

def offlineMapPort = providers.gradleProperty('offlinePort').map { Integer.parseInt(it) }.getOrElse(8766)
tasks.register('offlineCity', JavaExec) {
    dependsOn offlineAgent
    jvmArgumentProviders.add(namedMinecraftAccess)
    group = 'application'
    description = 'Launch the local city simulator and map without starting Minecraft'
    dependsOn offlineClasses
    classpath = sourceSets.offline.runtimeClasspath
    workingDir layout.buildDirectory.dir("offline/${offlineMapPort}").get().asFile
    doFirst { workingDir.mkdirs() }
    mainClass = 'com.livingcity.offline.OfflineServer'
    args file('tools/city-map.html').absolutePath, offlineMapPort.toString()
    jvmArgs '-Dfile.encoding=UTF-8'
}
